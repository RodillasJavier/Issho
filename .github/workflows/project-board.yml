name: Project board

# Every PR lives in either "In Review" or "Done" on the Issho project board.
# "Done" is handled by the board's own built-in workflows ("Pull request
# merged", "Item closed"); GitHub has no built-in trigger for a PR being
# *opened*, so this fills that gap.
#
# Drafts are included on purpose: an open PR is up for review, draft or not.
on:
  pull_request:
    types: [opened, reopened]

# The job talks to the board with PROJECT_TOKEN, not GITHUB_TOKEN — the default
# token can't reach a user-owned Project. It needs nothing from this repo.
permissions: {}

jobs:
  in-review:
    name: Move PR to In Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Secrets aren't exposed to fork PRs, so the job could only fail there.
    # Dependabot PRs pass this check but get no Actions secrets either; they
    # hit the empty-token warning below unless PROJECT_TOKEN is also added as
    # a Dependabot secret.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Set board status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # IDs from `gh project field-list 1 --owner RodillasJavier`. They
          # survive renames, but recreating the field or option changes them.
          PROJECT_OWNER: RodillasJavier
          PROJECT_NUMBER: 1
          PROJECT_ID: PVT_kwHOBigY984Be8S1
          STATUS_FIELD_ID: PVTSSF_lAHOBigY984Be8S1zhZS07s
          IN_REVIEW_OPTION_ID: 1e9ffd0a
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN secret is not set; skipping project board update."
            exit 0
          fi

          # Idempotent: returns the existing item if "Auto-add to project"
          # already put the PR on the board.
          item_id=$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
            --url "$PR_URL" --format json --jq '.id')

          # The built-in "Item added to project" workflow sets new items to
          # Todo, and it can fire after this step. Restrict it to issues in the
          # board's Workflows settings; the wait is a safety margin in case
          # it still runs on PRs. The read-back below catches it if it lands
          # later anyway.
          sleep 30

          set_status() {
            gh project item-edit --project-id "$PROJECT_ID" --id "$item_id" \
              --field-id "$STATUS_FIELD_ID" \
              --single-select-option-id "$IN_REVIEW_OPTION_ID" > /dev/null
          }

          # Matches on the field ID rather than its name, so renames are safe.
          current_status() {
            gh api graphql \
              -f query='query($id: ID!) { node(id: $id) { ... on ProjectV2Item {
                fieldValues(first: 50) { nodes { ... on ProjectV2ItemFieldSingleSelectValue {
                  optionId field { ... on ProjectV2SingleSelectField { id } } } } } } } }' \
              -f id="$item_id" \
              --jq ".data.node.fieldValues.nodes[] | select(.field.id == \"$STATUS_FIELD_ID\") | .optionId"
          }

          for attempt in 1 2; do
            set_status
            sleep 15
            if [ "$(current_status)" = "$IN_REVIEW_OPTION_ID" ]; then
              echo "Moved $PR_URL to In Review."
              exit 0
            fi
            echo "::warning::Status was overwritten after attempt $attempt."
          done

          echo "::error::Status keeps being overwritten; check that the board's \"Item added to project\" workflow is limited to issues."
          exit 1
